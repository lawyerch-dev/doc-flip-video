name: Build FFmpeg xfade-easing

on:
  workflow_dispatch:        # 手动触发
  push:
    tags: ['v*']            # 打 tag 时自动构建

env:
  FFMPEG_VERSION: "8.1.2"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14           # macOS ARM64 (M1)
            platform: darwin-arm64
            build_deps: |
              brew install nasm
          - os: macos-13           # macOS x86_64
            platform: darwin-x64
            build_deps: |
              brew install nasm
          - os: ubuntu-22.04
            platform: linux-x64
            build_deps: |
              sudo apt-get update
              sudo apt-get install -y nasm libx264-dev libmp3lame-dev libopus-dev libvpx-dev

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ${{ matrix.build_deps }}

      - name: Cache FFmpeg source
        uses: actions/cache@v4
        with:
          path: ffmpeg-src
          key: ffmpeg-${{ env.FFMPEG_VERSION }}

      - name: Download FFmpeg source
        run: |
          if [ ! -d "ffmpeg-src" ]; then
            curl -L "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" -o ffmpeg.tar.xz
            tar -xf ffmpeg.tar.xz
            mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg-src
            rm ffmpeg.tar.xz
          fi

      - name: Apply xfade-easing patches
        working-directory: ffmpeg-src
        run: |
          curl -sL "https://raw.githubusercontent.com/scriptituk/xfade-easing/main/src/vf_xfade.c" -o libavfilter/vf_xfade.c
          curl -sL "https://raw.githubusercontent.com/scriptituk/xfade-easing/main/src/xfade-easing.h" -o libavfilter/xfade-easing.h

      - name: Configure FFmpeg
        working-directory: ffmpeg-src
        run: |
          ./configure \
            --prefix="$(pwd)/install" \
            --enable-gpl \
            --enable-version3 \
            --enable-static \
            --disable-shared \
            --disable-doc \
            --disable-debug \
            --enable-ffmpeg \
            --disable-ffplay \
            --disable-ffprobe \
            --enable-pthreads \
            --enable-libx264 \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvpx

      - name: Build FFmpeg
        working-directory: ffmpeg-src
        run: |
          NPROC=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          make -j"$NPROC" ECFLAGS=-Wno-declaration-after-statement 2>&1 | tail -5

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: ffmpeg-src/ffmpeg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/ffmpeg-darwin-arm64/ffmpeg
            binaries/ffmpeg-darwin-x64/ffmpeg
            binaries/ffmpeg-linux-x64/ffmpeg
          generate_release_notes: true
