<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>模板工坊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/material-darker.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        height: 100vh;
        overflow: hidden;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* ── Topbar ── */
      .topbar {
        height: 44px;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
        flex-shrink: 0;
      }
      .topbar .logo {
        font-size: 14px;
        font-weight: 700;
        color: #fff;
      }
      .topbar .logo em {
        color: #f97316;
        font-style: normal;
      }
      .topbar .sep {
        width: 1px;
        height: 20px;
        background: #333;
      }
      .topbar select {
        background: #252525;
        border: 1px solid #333;
        color: #ccc;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
        font-family: inherit;
      }
      .topbar .spacer {
        flex: 1;
      }
      .topbar .status {
        font-size: 11px;
        color: #666;
      }
      .topbar .status.ok {
        color: #22c55e;
      }
      .btn-sm {
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid #333;
        border-radius: 4px;
        cursor: pointer;
        background: #252525;
        color: #ccc;
        font-family: inherit;
      }
      .btn-sm:hover {
        background: #333;
      }
      .btn-sm.primary {
        background: #f97316;
        border-color: #f97316;
        color: #fff;
      }
      .btn-sm.primary:hover {
        background: #ea580c;
      }
      .btn-sm.success {
        background: #22c55e;
        border-color: #22c55e;
        color: #fff;
      }

      /* ── Main ── */
      .main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      .panel {
        display: flex;
        flex-direction: column;
      }
      .panel-header {
        height: 32px;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        flex-shrink: 0;
        gap: 8px;
      }
      .panel-header .tab {
        padding: 3px 8px;
        cursor: pointer;
        border-radius: 3px;
        color: #666;
        background: none;
        border: none;
        font-family: inherit;
        font-size: 11px;
      }
      .panel-header .tab.active {
        background: #333;
        color: #ccc;
      }
      .panel-header .hint {
        margin-left: auto;
        color: #555;
        font-size: 10px;
        text-transform: none;
        letter-spacing: 0;
      }

      /* ── Left: Code Editor ── */
      .panel-code {
        width: 32%;
        min-width: 280px;
        border-right: 1px solid #2a2a2a;
        background: #1e1e1e;
      }
      .panel-code .CodeMirror {
        flex: 1;
        height: auto;
        font-size: 13px;
      }

      /* ── Center: Preview ── */
      .panel-preview {
        flex: 1;
        background: #151515;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: auto;
        position: relative;
      }
      .preview-frame {
        position: relative;
        transform-origin: top center;
      }
      .preview-frame iframe {
        border: 1px solid #2a2a2a;
        background: #fff;
        pointer-events: auto;
      }
      .preview-frame .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      .preview-frame .select-box {
        position: absolute;
        border: 2px solid #f97316;
        pointer-events: none;
        z-index: 20;
        display: none;
      }
      .preview-frame .select-label {
        position: absolute;
        top: -20px;
        left: -2px;
        background: #f97316;
        color: #fff;
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 2px;
        white-space: nowrap;
        pointer-events: none;
        z-index: 21;
        display: none;
      }
      .preview-info {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: #555;
        background: #1a1a1a;
        padding: 2px 10px;
        border-radius: 10px;
      }

      /* ── Right: Properties ── */
      .panel-props {
        width: 280px;
        min-width: 240px;
        border-left: 1px solid #2a2a2a;
        background: #1e1e1e;
        overflow-y: auto;
      }
      .prop-section {
        border-bottom: 1px solid #2a2a2a;
      }
      .prop-section-title {
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 600;
        color: #888;
        background: #1a1a1a;
      }
      .prop-body {
        padding: 8px 12px;
      }
      .prop-field {
        margin-bottom: 8px;
      }
      .prop-field label {
        display: block;
        font-size: 10px;
        color: #666;
        margin-bottom: 3px;
      }
      .prop-field input {
        width: 100%;
        padding: 4px 6px;
        font-size: 12px;
        background: #252525;
        border: 1px solid #333;
        border-radius: 3px;
        color: #ccc;
        font-family: inherit;
      }
      .prop-field input:focus {
        border-color: #f97316;
        outline: none;
      }
      .prop-field input[type="color"] {
        height: 26px;
        padding: 2px 4px;
        cursor: pointer;
      }
      .prop-row {
        display: flex;
        gap: 6px;
      }
      .prop-row .prop-field {
        flex: 1;
      }
      .prop-empty {
        padding: 20px;
        color: #444;
        font-size: 12px;
        text-align: center;
      }

      /* ── Resizer ── */
      .resizer {
        width: 4px;
        cursor: col-resize;
        background: transparent;
        transition: background 0.15s;
      }
      .resizer:hover,
      .resizer.active {
        background: #f97316;
      }

      /* ── Export modal ── */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      .modal.show {
        display: flex;
      }
      .modal-box {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 24px;
        max-width: 500px;
        width: 90%;
      }
      .modal-box h3 {
        font-size: 16px;
        margin-bottom: 12px;
        color: #fff;
      }
      .modal-box img {
        max-width: 100%;
        border: 1px solid #333;
        border-radius: 4px;
        margin: 12px 0;
      }
      .modal-box .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <span class="logo">🎨 <em>模板工坊</em></span>
        <div class="sep"></div>
        <select id="presetSelect" onchange="loadPreset(this.value)">
          <option value="default">默认红头</option>
          <option value="corporate">企业商务</option>
          <option value="government">政务蓝</option>
        </select>
        <button class="btn-sm" onclick="saveTemplate()">💾 保存</button>
        <button class="btn-sm" onclick="downloadTemplate()">⬇ 导出HTML</button>
        <div class="sep"></div>
        <button class="btn-sm success" onclick="exportPng()">📸 导出PNG</button>
        <div class="spacer"></div>
        <span class="status" id="status">就绪</span>
      </div>

      <div class="main">
        <!-- Left: Code -->
        <div class="panel panel-code" id="panelCode">
          <div class="panel-header">
            <button class="tab active" id="tabHtml" onclick="switchTab('html')">HTML</button>
            <button class="tab" id="tabCss" onclick="switchTab('css')">CSS</button>
            <span class="hint">拖拽预览中的元素 → 自动改代码</span>
          </div>
          <div id="editorHtml" style="flex: 1; overflow: hidden"></div>
          <div id="editorCss" style="flex: 1; overflow: hidden; display: none"></div>
        </div>
        <div class="resizer" id="resizer1"></div>

        <!-- Center: Preview -->
        <div class="panel panel-preview" id="panelPreview">
          <div class="preview-frame" id="previewFrame">
            <iframe id="previewIframe" sandbox="allow-same-origin"></iframe>
            <div class="select-box" id="selectBox"></div>
            <div class="select-label" id="selectLabel"></div>
          </div>
          <div class="preview-info" id="previewInfo">实时预览</div>
        </div>
        <div class="resizer" id="resizer2"></div>

        <!-- Right: Properties -->
        <div class="panel panel-props" id="panelProps">
          <div class="panel-header">属性面板</div>
          <div id="propsBody">
            <div class="prop-empty">点击预览中的元素查看属性</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Export Modal -->
    <div class="modal" id="exportModal">
      <div class="modal-box">
        <h3>📸 导出 PNG</h3>
        <div id="exportStatus">正在渲染...</div>
        <img id="exportImg" style="display: none" />
        <div class="actions">
          <button class="btn-sm" onclick="closeExportModal()">关闭</button>
          <button class="btn-sm primary" id="exportDownloadBtn" style="display: none" onclick="downloadExport()">
            下载图片
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/closetag.min.js"></script>
    <script>
      // ── State ──
      let selectedEl = null;
      let dragging = false;
      let dragStartX, dragStartY, dragOrigLeft, dragOrigTop;
      let updateTimer = null;

      // ── CodeMirror ──
      const cmHtml = CodeMirror(document.getElementById("editorHtml"), {
        mode: "htmlmixed",
        theme: "material-darker",
        lineNumbers: true,
        autoCloseTags: true,
        tabSize: 2,
        lineWrapping: true,
      });
      const cmCss = CodeMirror(document.getElementById("editorCss"), {
        mode: "css",
        theme: "material-darker",
        lineNumbers: true,
        tabSize: 2,
        lineWrapping: true,
      });
      cmHtml.on("change", () => scheduleUpdate());
      cmCss.on("change", () => scheduleUpdate());

      // ── Presets ──
      const PRESETS = {
        default: {
          html: `<!-- 模板工坊：默认红头风格 -->
<!-- 用 {{变量名}} 定义可配置内容 -->
<div id="page">
  <div class="watermark">No.004</div>
  <div class="leftband"></div>
  <div class="headerbg"></div>
  <div class="logo">法务</div>
  <div class="issuenum">
    <span class="prefix">第</span>
    <span class="num">004</span>
    <span class="suffix">期</span>
  </div>
  <div class="dateline">2026年07月20日</div>
  <div class="desc">法理明如镜，务知天下事！</div>
  <div class="line1"></div>
  <div class="line2"></div>
  <div class="headline">预览标题文字示例</div>
  <div class="source">来源：中国法院网</div>
  <div class="line3"></div>
  <div class="line4"></div>
  <div class="footer">关注我，了解更多法律新鲜事</div>
</div>`,
          css: `/* 模板样式 */

.line3 { position: absolute; left: 80px; top: 1350px; width: 920px; height: 2px; background: #cc0000; }

/* 标题 */
.headline {
  position: absolute; left: 80px; top: 750px;

}

/* 来源 */
.source {
  position: absolute; left: 80px; top: 1000px;
  font-size: 36px; color: #666;
}

/* 底部 */
.footer {
  position: absolute; left: 0; top: 1470px;
  width: 100%; text-align: center;
  font-size: 58px; font-weight: 700; color: #000;
}`,
        },
        corporate: {
          html: `<div id="page">
  <div class="banner"></div>
  <div class="logo">企业</div>
  <div class="meta">第001期 · 2026年07月20日</div>
  <div class="headline">商业资讯标题示例</div>
  <div class="source">来源：商业周刊</div>
  <div class="divider"></div>
  <div class="footer">关注我们，了解更多商业资讯</div>
</div>`,
          css: `* { margin: 0; padding: 0; box-sizing: border-box; }
#page { width: 1080px; height: 1840px; position: relative; overflow: hidden; font-family: "Noto Sans SC", sans-serif; background: #fdfefe; }
.banner { position: absolute; left: 0; top: 0; width: 100%; height: 500px; background: #1a5276; }
.logo { position: absolute; left: 80px; top: 180px; font-size: 96px; font-weight: 700; color: #fff; }
.meta { position: absolute; left: 80px; top: 300px; font-size: 28px; color: rgba(255,255,255,0.7); }
.headline { position: absolute; left: 80px; top: 560px; width: 920px; font-size: 48px; font-weight: 700; color: #2c3e50; line-height: 58px; }
.source { position: absolute; left: 80px; top: 780px; font-size: 28px; color: #7f8c8d; }

.footer { position: absolute; left: 0; top: 1450px; width: 100%; text-align: center; font-size: 42px; font-weight: 600; color: #1a5276; }`,
        },
        government: {
          html: `<div id="page">
  <div class="banner"></div>
  <div class="seal">政</div>
  <div class="logo">政务公开</div>
  <div class="meta">第001期 · 2026年07月20日</div>
  <div class="headline">政务信息公开公告示例</div>
  <div class="source">来源：市政府办公室</div>
  <div class="divider"></div>
  <div class="footer">为人民服务</div>
</div>`,
          css: `* { margin: 0; padding: 0; box-sizing: border-box; }
#page { width: 1080px; height: 1840px; position: relative; overflow: hidden; font-family: "Noto Sans SC", sans-serif; background: #f0f4f8; }
.banner { position: absolute; left: 0; top: 0; width: 100%; height: 480px; background: #1565c0; }
.seal { position: absolute; left: 80px; top: 160px; width: 160px; height: 160px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; color: #fff; font-weight: 700; }
.logo { position: absolute; left: 280px; top: 180px; font-size: 72px; font-weight: 700; color: #fff; }
.meta { position: absolute; left: 280px; top: 280px; font-size: 24px; color: rgba(255,255,255,0.8); }
.headline { position: absolute; left: 80px; top: 540px; width: 920px; font-size: 46px; font-weight: 700; color: #1a1a1a; line-height: 56px; }
.source { position: absolute; left: 80px; top: 750px; font-size: 26px; color: #666; }
.divider { position: absolute; left: 80px; top: 1300px; width: 920px; height: 3px; background: #1565c0; }
.footer { position: absolute; left: 0; top: 1420px; width: 100%; text-align: center; font-size: 40px; font-weight: 600; color: #1565c0; }`,
        },
      };

      // ── Load Preset ──
      function loadPreset(name) {
        const p = PRESETS[name];
        if (!p) return;
        cmHtml.setValue(p.html);
        cmCss.setValue(p.css);
        refreshPreview();
      }

      // ── Tab Switch ──
      function switchTab(tab) {
        document.getElementById("editorHtml").style.display = tab === "html" ? "" : "none";
        document.getElementById("editorCss").style.display = tab === "css" ? "" : "none";
        document.getElementById("tabHtml").classList.toggle("active", tab === "html");
        document.getElementById("tabCss").classList.toggle("active", tab === "css");
        if (tab === "html") cmHtml.refresh();
        if (tab === "css") cmCss.refresh();
      }

      // ── Preview Refresh ──
      function scheduleUpdate() {
        clearTimeout(updateTimer);
        updateTimer = setTimeout(refreshPreview, 300);
      }

      function refreshPreview() {
        const html = cmHtml.getValue();
        const css = cmCss.getValue();
        const iframe = document.getElementById("previewIframe");
        const doc = iframe.contentDocument;
        doc.open();
        doc.write(
          `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${css}</style></head><body>${html}</body></html>`,
        );
        doc.close();

        // 设置 iframe 尺寸为模板尺寸
        const page = doc.getElementById("page") || doc.querySelector("[id]") || doc.body.firstElementChild;
        if (page) {
          const w = parseInt(page.style.width) || page.offsetWidth || 1080;
          const h = parseInt(page.style.height) || page.offsetHeight || 1840;
          const scale = Math.min(
            1,
            (window.innerHeight - 100) / h,
            (document.getElementById("panelPreview").offsetWidth - 40) / w,
          );
          iframe.style.width = w + "px";
          iframe.style.height = h + "px";
          iframe.style.transform = `scale(${scale})`;
          iframe.style.transformOrigin = "top center";
          document.getElementById("previewFrame").style.width = w * scale + "px";
          document.getElementById("previewFrame").style.height = h * scale + "px";
        }

        // 注入拖拽和点击事件
        injectInteraction(iframe);
        clearSelection();
      }

      // ── Interaction: click to select, drag to move ──
      function injectInteraction(iframe) {
        const doc = iframe.contentDocument;
        const scale = parseFloat(iframe.style.transform?.match(/scale\(([\d.]+)\)/)?.[1] || 1);

        doc.addEventListener("mousedown", (e) => {
          const el = e.target;
          if (el === doc.body || el.id === "page") return;

          e.preventDefault();
          selectElement(el, iframe);

          // 开始拖拽
          const style = el.style;
          if (style.position === "absolute") {
            dragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragOrigLeft = parseInt(style.left) || 0;
            dragOrigTop = parseInt(style.top) || 0;

            const onMove = (e2) => {
              if (!dragging) return;
              const dx = (e2.clientX - dragStartX) / scale;
              const dy = (e2.clientY - dragStartY) / scale;
              const newLeft = Math.round(dragOrigLeft + dx);
              const newTop = Math.round(dragOrigTop + dy);
              el.style.left = newLeft + "px";
              el.style.top = newTop + "px";
              updateSelectBox(el, iframe);
              updatePropsPanel(el);
            };

            const onUp = () => {
              dragging = false;
              doc.removeEventListener("mousemove", onMove);
              doc.removeEventListener("mouseup", onUp);
              // 同步回代码
              syncStyleToCode(el);
            };

            doc.addEventListener("mousemove", onMove);
            doc.addEventListener("mouseup", onUp);
          }
        });
      }

      // ── Select Element ──
      function selectElement(el, iframe) {
        selectedEl = el;
        updateSelectBox(el, iframe);
        updatePropsPanel(el);
      }

      function clearSelection() {
        selectedEl = null;
        document.getElementById("selectBox").style.display = "none";
        document.getElementById("selectLabel").style.display = "none";
        document.getElementById("propsBody").innerHTML = '<div class="prop-empty">点击预览中的元素查看属性</div>';
      }

      function updateSelectBox(el, iframe) {
        const iframeRect = iframe.getBoundingClientRect();
        const scale = parseFloat(iframe.style.transform?.match(/scale\(([\d.]+)\)/)?.[1] || 1);
        const rect = el.getBoundingClientRect();

        const box = document.getElementById("selectBox");
        const label = document.getElementById("selectLabel");

        box.style.display = "block";
        box.style.left = rect.left - iframeRect.left + iframe.offsetLeft + "px";
        box.style.top = rect.top - iframeRect.top + iframe.offsetTop + "px";
        box.style.width = rect.width + "px";
        box.style.height = rect.height + "px";

        label.style.display = "block";
        label.style.left = box.style.left;
        label.style.top = parseFloat(box.style.top) - 20 + "px";
        const tag = el.tagName.toLowerCase();
        const id = el.id ? `#${el.id}` : "";
        const cls = el.className ? `.${el.className.split(" ")[0]}` : "";
        label.textContent = `${tag}${id}${cls}`;
      }

      // ── Properties Panel ──
      function updatePropsPanel(el) {
        const s = el.style;
        const tag = el.tagName.toLowerCase();
        const id = el.id || "";
        const cls = el.className || "";

        let html = `<div class="prop-section"><div class="prop-section-title">元素 &lt;${tag}&gt;${id ? " #" + id : ""}${cls ? " ." + cls.split(" ")[0] : ""}</div><div class="prop-body">`;

        // Position
        if (s.position === "absolute") {
          html += `<div class="prop-row">
      <div class="prop-field"><label>left</label><input type="number" value="${parseInt(s.left) || 0}" onchange="setStyle('left',this.value+'px')"/></div>
      <div class="prop-field"><label>top</label><input type="number" value="${parseInt(s.top) || 0}" onchange="setStyle('top',this.value+'px')"/></div>
    </div>`;
        }

        // Size
        if (s.width)
          html += `<div class="prop-field"><label>width</label><input value="${s.width}" onchange="setStyle('width',this.value)"/></div>`;
        if (s.height)
          html += `<div class="prop-field"><label>height</label><input value="${s.height}" onchange="setStyle('height',this.value)"/></div>`;

        // Colors
        const bg = s.background || s.backgroundColor;
        if (bg && !bg.includes("gradient"))
          html += `<div class="prop-field"><label>background</label><input type="color" value="${toHex(bg)}" onchange="setStyle('background',this.value)"/></div>`;
        if (s.color)
          html += `<div class="prop-field"><label>color</label><input type="color" value="${toHex(s.color)}" onchange="setStyle('color',this.value)"/></div>`;

        // Typography
        if (s.fontSize)
          html += `<div class="prop-field"><label>font-size</label><input value="${s.fontSize}" onchange="setStyle('fontSize',this.value)"/></div>`;
        if (s.fontWeight)
          html += `<div class="prop-field"><label>font-weight</label><input value="${s.fontWeight}" onchange="setStyle('fontWeight',this.value)"/></div>`;

        // Text content (for leaf elements)
        if (el.children.length === 0 && el.textContent.trim()) {
          html += `<div class="prop-field"><label>text</label><input value="${escAttr(el.textContent)}" onchange="selectedEl.textContent=this.value;syncTextToCode(selectedEl)"/></div>`;
        }

        // Border radius
        if (s.borderRadius)
          html += `<div class="prop-field"><label>border-radius</label><input value="${s.borderRadius}" onchange="setStyle('borderRadius',this.value)"/></div>`;

        html += "</div></div>";

        // All styles (advanced)
        html += `<div class="prop-section"><div class="prop-section-title">全部样式</div><div class="prop-body">`;
        for (const [k, v] of Object.entries(s)) {
          if (v && typeof v === "string" && !k.startsWith("webkit") && k !== "length" && k !== "parentRule") {
            html += `<div class="prop-field"><label>${k}</label><input value="${v}" onchange="setStyle('${k}',this.value)" style="font-size:11px"/></div>`;
          }
        }
        html += "</div></div>";

        document.getElementById("propsBody").innerHTML = html;
      }

      function setStyle(prop, value) {
        if (!selectedEl) return;
        selectedEl.style[prop] = value;
        updateSelectBox(selectedEl, document.getElementById("previewIframe"));
        syncStyleToCode(selectedEl);
      }

      // ── Sync: preview → code ──
      function syncStyleToCode(el) {
        // 找到元素在 HTML 中的位置并更新 style 属性
        const html = cmHtml.getValue();
        const elHtml = el.outerHTML;
        // 简单策略：用 id 或 class+tag 定位
        const id = el.id;
        const cls = el.className;
        let searchStr;
        if (id) {
          searchStr = `id="${id}"`;
        } else if (cls) {
          searchStr = `class="${cls.split(" ")[0]}"`;
        } else {
          return; // 无法定位，跳过同步
        }

        const idx = html.indexOf(searchStr);
        if (idx === -1) return;

        // 找到这个元素的 style="..." 部分
        const beforeSearch = html.slice(0, idx);
        const tagStart = beforeSearch.lastIndexOf("<");
        const afterSearch = html.slice(idx);
        const tagEnd = afterSearch.indexOf(">");

        if (tagStart === -1 || tagEnd === -1) return;

        const fullTag = html.slice(tagStart, idx + tagEnd + 1);
        const newStyle = el.getAttribute("style");
        let newTag;

        if (fullTag.includes('style="')) {
          newTag = fullTag.replace(/style="[^"]*"/, `style="${newStyle}"`);
        } else {
          newTag = fullTag.replace(/(id|class)="/, `style="${newStyle}" $1="`);
        }

        const newHtml = html.slice(0, tagStart) + newTag + html.slice(tagStart + fullTag.length);
        cmHtml.setValue(newHtml);
      }

      function syncTextToCode(el) {
        const html = cmHtml.getValue();
        const text = el.textContent;
        const oldHtml = el.outerHTML;
        const newHtml = html.replace(oldHtml, el.outerHTML);
        if (newHtml !== html) cmHtml.setValue(newHtml);
      }

      // ── Helpers ──
      function toHex(color) {
        if (!color) return "#000000";
        if (color.startsWith("#"))
          return color.length === 4 ? "#" + color[1] + color[1] + color[2] + color[2] + color[3] + color[3] : color;
        const m = color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
        if (m) return "#" + [m[1], m[2], m[3]].map((x) => parseInt(x).toString(16).padStart(2, "0")).join("");
        return "#000000";
      }
      function escAttr(s) {
        return String(s).replace(/"/g, "&quot;").replace(/</g, "&lt;");
      }

      // ── Save / Load / Export ──
      function saveTemplate() {
        const data = { html: cmHtml.getValue(), css: cmCss.getValue() };
        localStorage.setItem("tpl_workshop", JSON.stringify(data));
        document.getElementById("status").textContent = "✅ 已保存";
        document.getElementById("status").className = "status ok";
        setTimeout(() => {
          document.getElementById("status").textContent = "就绪";
          document.getElementById("status").className = "status";
        }, 2000);
      }

      function downloadTemplate() {
        const html = `<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<style>\n${cmCss.getValue()}\n</style>\n</head>\n<body>\n${cmHtml.getValue()}\n</body>\n</html>`;
        const blob = new Blob([html], { type: "text/html" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "template.html";
        a.click();
      }

      async function exportPng() {
        const modal = document.getElementById("exportModal");
        const status = document.getElementById("exportStatus");
        const img = document.getElementById("exportImg");
        const btn = document.getElementById("exportDownloadBtn");

        modal.classList.add("show");
        status.textContent = "正在渲染...";
        img.style.display = "none";
        btn.style.display = "none";

        try {
          // 从 iframe 获取浏览器已解析的 HTML（CSS 已应用）
          const iframe = document.getElementById("previewIframe");
          const doc = iframe.contentDocument;
          // 序列化 DOM 为 HTML（浏览器已计算所有样式）
          const renderedHtml = doc.body.innerHTML;

          const resp = await fetch("/api/render-html", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ html: renderedHtml }),
          });
          if (!resp.ok) throw new Error((await resp.json()).error || "渲染失败");
          const blob = await resp.blob();
          img.src = URL.createObjectURL(blob);
          img.style.display = "block";
          status.textContent = "渲染完成";
          btn.style.display = "";
        } catch (e) {
          status.textContent = "❌ " + e.message;
        }
      }

      function closeExportModal() {
        document.getElementById("exportModal").classList.remove("show");
      }
      function downloadExport() {
        const a = document.createElement("a");
        a.href = document.getElementById("exportImg").src;
        a.download = "template.png";
        a.click();
      }

      // ── Keyboard ──
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "s") {
          e.preventDefault();
          saveTemplate();
        }
        if (e.key === "Escape") clearSelection();
        if (e.key === "Delete" && selectedEl && !e.target.closest(".CodeMirror")) {
          const html = cmHtml.getValue();
          cmHtml.setValue(html.replace(selectedEl.outerHTML, ""));
          clearSelection();
          refreshPreview();
        }
      });

      // ── Resizer ──
      function initResizer(id, panelId, dir) {
        const r = document.getElementById(id),
          p = document.getElementById(panelId);
        let sx, sw;
        r.addEventListener("pointerdown", (e) => {
          sx = e.clientX;
          sw = p.offsetWidth;
          r.classList.add("active");
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          e.preventDefault();
        });
        window.addEventListener("pointermove", (e) => {
          if (!r.classList.contains("active")) return;
          p.style.width = (dir === "left" ? sw + e.clientX - sx : sw - (e.clientX - sx)) + "px";
        });
        window.addEventListener("pointerup", () => {
          r.classList.remove("active");
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
        });
      }

      // ── Init ──
      initResizer("resizer1", "panelCode", "left");
      initResizer("resizer2", "panelProps", "right");

      // Load saved or default
      const saved = localStorage.getItem("tpl_workshop");
      if (saved) {
        try {
          const d = JSON.parse(saved);
          cmHtml.setValue(d.html);
          cmCss.setValue(d.css);
        } catch {}
      } else {
        loadPreset("default");
      }
      refreshPreview();
    </script>
  </body>
</html>
