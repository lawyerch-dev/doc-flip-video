<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>模板工坊</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .tpl-app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--bg);
      }
      .tpl-topbar {
        height: 48px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 16px;
        flex-shrink: 0;
      }
      .tpl-topbar h1 {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }
      .tpl-topbar h1 em {
        color: var(--accent);
        font-style: normal;
      }
      .tpl-topbar .sep {
        width: 1px;
        height: 20px;
        background: var(--border);
      }
      .tpl-main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      .tpl-sidebar {
        width: 320px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        background: var(--card);
        overflow-y: auto;
        padding: 16px;
      }
      .tpl-sidebar h2 {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .tpl-preview {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        overflow: auto;
        padding: 20px;
      }
      .tpl-preview img {
        max-height: calc(100vh - 100px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
      }
      .tpl-preview .empty {
        color: var(--text-muted);
        font-size: 14px;
        text-align: center;
      }
      .tpl-field {
        margin-bottom: 12px;
      }
      .tpl-field label {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 4px;
        font-weight: 500;
      }
      .tpl-field input,
      .tpl-field select {
        width: 100%;
        padding: 6px 8px;
        font-size: 13px;
        font-family: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
      }
      .tpl-field input:focus,
      .tpl-field select:focus {
        border-color: var(--accent);
        outline: none;
      }
      .tpl-section {
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      .tpl-section:last-child {
        border-bottom: none;
      }
      .tpl-section-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 10px;
      }
      .tpl-status {
        font-size: 11px;
        color: var(--text-muted);
      }
      .tpl-status.ok {
        color: var(--success);
      }
      .tpl-btn {
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 500;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        font-family: inherit;
      }
      .tpl-btn:hover {
        background: var(--card-hover);
      }
      .tpl-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .tpl-btn.primary:hover {
        opacity: 0.9;
      }
      .tpl-info {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 8px;
        line-height: 1.5;
      }
      .tpl-info code {
        color: var(--accent);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="tpl-app">
      <!-- Topbar -->
      <div class="tpl-topbar">
        <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 13px">← 返回工作台</a>
        <div class="sep"></div>
        <h1>🎨 <em>模板工坊</em></h1>
        <div class="sep"></div>
        <select id="templateSelect" onchange="onTemplateChange()">
          <option value="">选择模板...</option>
        </select>
        <select id="articleSelect" onchange="onArticleChange()">
          <option value="">选择文章...</option>
        </select>
        <div style="flex: 1"></div>
        <span class="tpl-status" id="status">就绪</span>
        <button class="tpl-btn primary" onclick="doRender()">▶ 渲染</button>
        <button class="tpl-btn" onclick="downloadPng()">⬇ 下载 PNG</button>
      </div>

      <div class="tpl-main">
        <!-- Left: Controls -->
        <div class="tpl-sidebar" id="sidebar">
          <div class="tpl-section">
            <div class="tpl-section-title">模板</div>
            <div class="tpl-field">
              <label>当前模板</label>
              <select id="tplSelect2" onchange="onTemplateChange()">
                <option value="">选择模板...</option>
              </select>
            </div>
            <div class="tpl-info">
              模板文件位于 <code>packages/template-render/templates/</code><br />
              用
              <a href="https://github.com/dromara/yft-design" target="_blank" style="color: var(--accent)"
                >yft-design</a
              >
              设计新模板
            </div>
          </div>

          <div class="tpl-section">
            <div class="tpl-section-title">文章数据</div>
            <div class="tpl-field">
              <label>文章</label>
              <select id="articleSelect2" onchange="onArticleChange()">
                <option value="">选择文章...</option>
              </select>
            </div>
            <div id="dataFields"></div>
          </div>

          <div class="tpl-section">
            <div class="tpl-section-title">自定义数据</div>
            <div class="tpl-info">在下方覆盖或添加字段值，模板中的 <code>{{key}}</code> 会被替换</div>
            <div class="tpl-field">
              <label>headline</label>
              <input id="d_headline" oninput="onDataChange()" placeholder="标题文字" />
            </div>
            <div class="tpl-field">
              <label>accent (颜色)</label>
              <input id="d_accent" type="color" value="#cc0000" oninput="onDataChange()" />
            </div>
            <div class="tpl-field">
              <label>logoText</label>
              <input id="d_logoText" value="法务" oninput="onDataChange()" />
            </div>
            <div class="tpl-field">
              <label>footerText</label>
              <input id="d_footerText" value="关注我，了解更多法律新鲜事" oninput="onDataChange()" />
            </div>
          </div>
        </div>

        <!-- Center: Preview -->
        <div class="tpl-preview" id="previewArea">
          <div class="empty" id="placeholder">
            选择模板和文章，点击 ▶ 渲染<br />
            <span style="font-size: 12px; margin-top: 8px; display: inline-block"
              >或用 CLI: <code>node packages/template-render/index.mjs</code></span
            >
          </div>
          <img id="previewImg" style="display: none" alt="preview" />
        </div>
      </div>
    </div>

    <script>
      let templates = [];
      let articles = [];
      let currentData = {};

      // ── Init ──
      async function init() {
        // 加载模板列表
        try {
          const resp = await fetch("/api/templates-list");
          if (resp.ok) templates = await resp.json();
        } catch {}
        populateSelect(
          "templateSelect",
          templates.map((t) => ({ value: t.id, label: t.name })),
        );
        populateSelect(
          "tplSelect2",
          templates.map((t) => ({ value: t.id, label: t.name })),
        );

        // 加载文章列表
        try {
          const resp = await fetch("/api/configs");
          if (resp.ok) articles = await resp.json();
        } catch {}
        const articleOpts = articles.map((a) => ({
          value: a.issueNum,
          label: `第${String(a.issueNum).padStart(3, "0")}期 - ${a.headline}`,
        }));
        populateSelect("articleSelect", articleOpts);
        populateSelect("articleSelect2", articleOpts);
      }

      function populateSelect(id, opts) {
        const sel = document.getElementById(id);
        const first = sel.options[0];
        sel.innerHTML = "";
        sel.appendChild(first);
        for (const o of opts) {
          const opt = document.createElement("option");
          opt.value = o.value;
          opt.textContent = o.label;
          sel.appendChild(opt);
        }
      }

      // ── Template change ──
      function onTemplateChange() {
        const val = document.getElementById("templateSelect").value || document.getElementById("tplSelect2").value;
        document.getElementById("templateSelect").value = val;
        document.getElementById("tplSelect2").value = val;
      }

      // ── Article change ──
      async function onArticleChange() {
        const val = document.getElementById("articleSelect").value || document.getElementById("articleSelect2").value;
        document.getElementById("articleSelect").value = val;
        document.getElementById("articleSelect2").value = val;
        if (!val) return;

        setStatus("加载文章数据...");
        try {
          const padded = String(val).padStart(3, "0");
          const resp = await fetch(`/data/articles/article-${padded}.json`);
          const article = await resp.json();

          // 提取数据
          const m = article.meta || {};
          const cover = article.cover || {};
          const content = article.content || {};
          const paras = content.paragraphs || [];

          currentData = {
            issueNum: String(m.issueNumber || 0).padStart(3, "0"),
            dateText: `${m.year}年${String(m.month).padStart(2, "0")}月${String(m.day).padStart(2, "0")}日`,
            description: m.description || "",
            headline: cover.headline || "",
            coverSource: cover.source || "",
            contentTitle: content.title || "",
            contentSubtitle: content.subtitle || "",
            contentSource: content.source || "",
            accent: "#cc0000",
            bgColor: "#ffffff",
            logoText: "法务",
            footerText: "关注我，了解更多法律新鲜事",
          };
          paras.slice(0, 5).forEach((p, i) => {
            currentData[`para${i + 1}`] = p.text || "";
            currentData[`hl${i + 1}`] = p.highlight || "";
          });

          // 更新表单
          document.getElementById("d_headline").value = currentData.headline;
          document.getElementById("d_accent").value = currentData.accent;
          document.getElementById("d_logoText").value = currentData.logoText;
          document.getElementById("d_footerText").value = currentData.footerText;

          // 显示数据字段
          const fieldsDiv = document.getElementById("dataFields");
          fieldsDiv.innerHTML = Object.entries(currentData)
            .map(
              ([k, v]) =>
                `<div class="tpl-field"><label>${k}</label><input value="${escAttr(v)}" data-key="${k}" onchange="onFieldChange('${k}',this.value)"/></div>`,
            )
            .join("");

          setStatus("数据已加载", "ok");
        } catch (e) {
          setStatus("加载失败: " + e.message);
        }
      }

      function onFieldChange(key, value) {
        currentData[key] = value;
      }

      function onDataChange() {
        currentData.headline = document.getElementById("d_headline").value;
        currentData.accent = document.getElementById("d_accent").value;
        currentData.logoText = document.getElementById("d_logoText").value;
        currentData.footerText = document.getElementById("d_footerText").value;
      }

      // ── Render ──
      async function doRender() {
        const tplId = document.getElementById("templateSelect").value;
        if (!tplId) return setStatus("请先选择模板");

        setStatus("渲染中...");
        try {
          const start = Date.now();
          const resp = await fetch("/api/render-template", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ templateId: tplId, data: currentData }),
          });
          if (!resp.ok) throw new Error((await resp.json()).error || "渲染失败");
          const blob = await resp.blob();
          const url = URL.createObjectURL(blob);
          const img = document.getElementById("previewImg");
          if (img.src.startsWith("blob:")) URL.revokeObjectURL(img.src);
          img.src = url;
          img.style.display = "block";
          document.getElementById("placeholder").style.display = "none";

          const ms = Date.now() - start;
          setStatus(`渲染完成 ${ms}ms (${(blob.size / 1024).toFixed(0)}KB)`, "ok");
        } catch (e) {
          setStatus("❌ " + e.message);
        }
      }

      // ── Download ──
      function downloadPng() {
        const img = document.getElementById("previewImg");
        if (!img.src || img.style.display === "none") return setStatus("请先渲染");
        const a = document.createElement("a");
        a.href = img.src;
        a.download = `template-${document.getElementById("templateSelect").value || "output"}.png`;
        a.click();
      }

      // ── Helpers ──
      function setStatus(text, cls) {
        const el = document.getElementById("status");
        el.textContent = text;
        el.className = "tpl-status" + (cls ? " " + cls : "");
      }
      function escAttr(s) {
        return String(s).replace(/"/g, "&quot;").replace(/</g, "&lt;");
      }

      init();
    </script>
  </body>
</html>
