<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>模板工坊</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        height: 100vh;
        overflow: hidden;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .topbar {
        height: 44px;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
        flex-shrink: 0;
      }
      .topbar .logo {
        font-size: 14px;
        font-weight: 700;
        color: #fff;
      }
      .topbar .logo em {
        color: #f97316;
        font-style: normal;
      }
      .topbar .sep {
        width: 1px;
        height: 20px;
        background: #333;
      }
      .topbar select {
        background: #252525;
        border: 1px solid #333;
        color: #ccc;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
        font-family: inherit;
      }
      .topbar .spacer {
        flex: 1;
      }
      .topbar .status {
        font-size: 11px;
        color: #666;
      }
      .topbar .status.ok {
        color: #22c55e;
      }
      .btn-sm {
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid #333;
        border-radius: 4px;
        cursor: pointer;
        background: #252525;
        color: #ccc;
        font-family: inherit;
      }
      .btn-sm:hover {
        background: #333;
      }
      .btn-sm.primary {
        background: #f97316;
        border-color: #f97316;
        color: #fff;
      }
      .btn-sm.primary:hover {
        background: #ea580c;
      }
      .main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      .panel {
        display: flex;
        flex-direction: column;
      }
      .panel-header {
        height: 32px;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        flex-shrink: 0;
      }
      .panel-code {
        width: 35%;
        min-width: 300px;
        border-right: 1px solid #2a2a2a;
        background: #1e1e1e;
      }
      .panel-code textarea {
        flex: 1;
        width: 100%;
        background: #1e1e1e;
        color: #a6e22e;
        border: none;
        padding: 12px;
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 13px;
        line-height: 1.5;
        resize: none;
        outline: none;
        tab-size: 2;
      }
      .panel-preview {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #151515;
        overflow: auto;
        position: relative;
      }
      .panel-preview img {
        max-height: calc(100vh - 80px);
        max-width: 100%;
        border: 1px solid #2a2a2a;
        border-radius: 4px;
      }
      .panel-preview .empty {
        color: #444;
        font-size: 14px;
      }
      .panel-preview .info {
        position: absolute;
        bottom: 8px;
        font-size: 11px;
        color: #555;
        background: #1a1a1a;
        padding: 2px 10px;
        border-radius: 10px;
      }
      .panel-props {
        width: 300px;
        min-width: 240px;
        border-left: 1px solid #2a2a2a;
        background: #1e1e1e;
        overflow-y: auto;
      }
      .prop-field {
        padding: 6px 12px;
        border-bottom: 1px solid #222;
      }
      .prop-field label {
        display: block;
        font-size: 10px;
        color: #666;
        margin-bottom: 3px;
      }
      .prop-field input {
        width: 100%;
        padding: 4px 6px;
        font-size: 12px;
        background: #252525;
        border: 1px solid #333;
        border-radius: 3px;
        color: #ccc;
        font-family: inherit;
      }
      .prop-field input:focus {
        border-color: #f97316;
        outline: none;
      }
      .prop-field input[type="color"] {
        height: 26px;
        padding: 2px 4px;
        cursor: pointer;
      }
      .resizer {
        width: 4px;
        cursor: col-resize;
        background: transparent;
        transition: background 0.15s;
      }
      .resizer:hover,
      .resizer.active {
        background: #f97316;
      }
      .error {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        background: #7f1d1d;
        color: #fca5a5;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        max-width: 80%;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <span class="logo">🎨 <em>模板工坊</em></span>
        <div class="sep"></div>
        <select id="tplSelect" onchange="loadPreset(this.value)">
          <option value="default">默认红头</option>
          <option value="corporate">企业商务</option>
          <option value="government">政务蓝</option>
        </select>
        <button class="btn-sm" onclick="saveTemplate()">💾 保存</button>
        <button class="btn-sm" onclick="loadSaved()">📂 加载</button>
        <div class="spacer"></div>
        <span class="status" id="status">就绪</span>
        <button class="btn-sm primary" onclick="doRender()">▶ 渲染 (Ctrl+Enter)</button>
      </div>
      <div class="main">
        <div class="panel panel-code" id="panelCode">
          <div class="panel-header">模板 JSON</div>
          <textarea id="codeEditor" spellcheck="false"></textarea>
        </div>
        <div class="resizer" id="resizer1"></div>
        <div class="panel panel-preview" id="panelPreview">
          <div class="empty" id="placeholder">点击 ▶ 渲染 或 Ctrl+Enter</div>
          <img id="previewImg" style="display: none" />
          <div class="error" id="errorEl" style="display: none"></div>
          <div class="info" id="infoEl"></div>
        </div>
        <div class="resizer" id="resizer2"></div>
        <div class="panel panel-props" id="panelProps">
          <div class="panel-header">快速编辑</div>
          <div id="propsBody"></div>
        </div>
      </div>
    </div>
    <script>

            {

              style: {

                left: 0,
                top: 1420,
                width: 1080,

          ],

      // ── 变量替换 ──
      function applyVars(template) {
        const vars = template._vars || {};
        return JSON.stringify(template, null, 2).replace(/\{\{(\w+)\}\}/g, (_, k) => vars[k] ?? `{{${k}}}`);
      }

      // ── 加载预设 ──
      function loadPreset(name) {
        const tpl = PRESETS[name];
        if (!tpl) return;
        editor.value = applyVars(tpl);
        buildPropsPanel(tpl._vars || {});
        doRender();
      }

      // ── 加载已保存 ──
      function loadSaved() {
        const saved = localStorage.getItem("tpl_custom");
        if (saved) {
          editor.value = saved;
          detectAndBuildProps();
          doRender();
        } else {
          alert("没有已保存的模板");
        }
      }

      function saveTemplate() {
        localStorage.setItem("tpl_custom", editor.value);
        document.getElementById("status").textContent = "✅ 已保存";
        document.getElementById("status").className = "status ok";
        setTimeout(() => {
          document.getElementById("status").textContent = "就绪";
          document.getElementById("status").className = "status";
        }, 2000);
      }

      // ── 属性面板 ──
      function buildPropsPanel(vars) {
        const body = document.getElementById("propsBody");
        let html = "";
        for (const [k, v] of Object.entries(vars)) {
          const isColor = /^#[0-9a-fA-F]{3,8}$/.test(v);
          html += `<div class="prop-field"><label>${k}</label><input type="${isColor ? "color" : "text"}" value="${escAttr(v)}" data-var="${k}" onchange="onPropChange('${k}',this.value)"/></div>`;
        }
        body.innerHTML = html;
      }

      function detectAndBuildProps() {
        try {
          const tpl = JSON.parse(editor.value);
          const vars = tpl._vars || {};
          buildPropsPanel(vars);
        } catch {}
      }

      function onPropChange(key, value) {
        try {
          const tpl = JSON.parse(editor.value);
          if (!tpl._vars) tpl._vars = {};
          tpl._vars[key] = value;
          // 替换模板中的 {{key}}
          const json = JSON.stringify(tpl, null, 2);
          editor.value = json.replace(new RegExp(`\\{\\{${key}\\}\\}`, "g"), value);
          scheduleRender();
        } catch {}
      }

      function escAttr(s) {
        return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      }

      // ── 渲染 ──
      function scheduleRender() {
        clearTimeout(debounce);
        debounce = setTimeout(doRender, 400);
      }

      async function doRender() {
        const status = document.getElementById("status");
        const img = document.getElementById("previewImg");
        const ph = document.getElementById("placeholder");
        const errEl = document.getElementById("errorEl");
        const info = document.getElementById("infoEl");

        let parsed;
        try {
          parsed = JSON.parse(editor.value);
        } catch (e) {
          errEl.textContent = "JSON 解析错误: " + e.message;
          errEl.style.display = "block";
          return;
        }

        status.textContent = "渲染中...";
        errEl.style.display = "none";

        try {
          const start = Date.now();
          const resp = await fetch("/api/render-template", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ elements: parsed.elements || [] }),
          });
          if (!resp.ok) {
            const err = await resp.json().catch(() => ({ error: resp.statusText }));
            throw new Error(err.error || "渲染失败");
          }
          const blob = await resp.blob();
          const url = URL.createObjectURL(blob);
          if (img.src.startsWith("blob:")) URL.revokeObjectURL(img.src);
          img.src = url;
          img.style.display = "block";
          ph.style.display = "none";
          const ms = Date.now() - start;
          info.textContent = `${ms}ms · ${(blob.size / 1024).toFixed(0)}KB`;
          status.textContent = "就绪";
          status.className = "status ok";
        } catch (e) {
          errEl.textContent = e.message;
          errEl.style.display = "block";
          status.textContent = "错误";
          status.className = "status";
        }
      }

      // ── 编辑器变化 → 自动重建属性面板 ──
      editor.addEventListener("input", () => {
        detectAndBuildProps();
        scheduleRender();
      });

      // ── 快捷键 ──
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          doRender();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === "s") {
          e.preventDefault();
          saveTemplate();
        }
      });

      // ── 拖拽调整面板宽度 ──
      function initResizer(id, panelId, dir) {
        const r = document.getElementById(id);
        const p = document.getElementById(panelId);
        let startX, startW;
        r.addEventListener("pointerdown", (e) => {
          startX = e.clientX;
          startW = p.offsetWidth;
          r.classList.add("active");
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          e.preventDefault();
        });
        window.addEventListener("pointermove", (e) => {
          if (!r.classList.contains("active")) return;
          p.style.width = (dir === "left" ? startW + e.clientX - startX : startW - (e.clientX - startX)) + "px";
        });
        window.addEventListener("pointerup", () => {
          r.classList.remove("active");
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
        });
      }

      // ── Tab 键在 textarea 中插入缩进 ──
      editor.addEventListener("keydown", (e) => {
        if (e.key === "Tab") {
          e.preventDefault();
          const s = editor.selectionStart,
            end = editor.selectionEnd;
          editor.value = editor.value.substring(0, s) + "  " + editor.value.substring(end);
          editor.selectionStart = editor.selectionEnd = s + 2;
        }
      });

      // ── 初始化 ──
      initResizer("resizer1", "panelCode", "left");
      initResizer("resizer2", "panelProps", "right");
      loadPreset("default");
    </script>
  </body>
</html>
